<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ibbi · Register</title>
  <script>
    if(!/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&window.innerWidth>=768)
      window.location.replace('register.html');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="shared/mobile-styles.css">
  <style>
    .pub-topbar {
      display: flex; align-items: center; height: 56px;
      padding: 0 8px; background: #fff;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
      position: relative; z-index: 100;
    }
    .topbar-back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border: none; background: none;
      cursor: pointer; color: var(--blue);
    }
    .topbar-back-btn svg { width: 22px; height: 22px; }
    .pub-logo-center {
      flex: 1; text-align: center;
      font-size: 1.1rem; font-weight: 900; color: var(--navy);
      letter-spacing: -.5px;
    }
    .topbar-spacer { width: 44px; flex-shrink: 0; }
    /* Progress bar */
    .reg-progress {
      height: 4px; background: var(--border); flex-shrink: 0;
    }
    .reg-progress-fill {
      height: 100%; background: var(--blue);
      border-radius: 0 2px 2px 0;
      transition: width .3s ease;
    }
    /* Role cards */
    .role-card {
      background: #fff; border: 2px solid var(--border);
      border-radius: 16px; padding: 20px 18px;
      display: flex; align-items: center; gap: 16px;
      cursor: pointer; transition: all .15s;
      text-decoration: none; color: inherit;
    }
    .role-card:active { transform: scale(.98); }
    .role-card.selected { border-color: var(--blue); background: var(--blue-light); }
    .role-card-ic {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0;
    }
    .role-card-ic.biz  { background: #EBF3FF; }
    .role-card-ic.infl { background: #FEF3C7; }
    .role-card-body { flex: 1; }
    .role-card-title { font-size: 1rem; font-weight: 800; color: var(--navy); }
    .role-card-sub { font-size: .8rem; color: var(--text-mid); margin-top: 3px; line-height: 1.4; }
    .role-card-arrow { color: var(--text-light); font-size: 1.1rem; }
    /* Error block */
    .mob-err {
      display: none; color: var(--red);
      font-size: .8rem; font-weight: 600;
      background: #fee2e2; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 14px;
    }
    /* Platform connect cards */
    .plat-card {
      background: #fff; border: 1.5px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 10px; transition: border-color .2s;
    }
    .plat-card.connected { border-color: #10b981; background: #f0fdf4; }
    .plat-ic {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .plat-name { flex: 1; font-size: .9rem; font-weight: 700; color: var(--navy); }
    .plat-btn {
      padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--blue);
      background: var(--blue-light); color: var(--blue);
      font-size: .78rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .plat-btn.done { background: #10b981; border-color: #10b981; color: #fff; }
    /* Review summary */
    .sum-row {
      display: flex; align-items: center; padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .sum-row:last-child { border-bottom: none; }
    .sum-k { font-size: .78rem; color: var(--text-mid); width: 90px; flex-shrink: 0; }
    .sum-v { font-size: .88rem; font-weight: 700; color: var(--navy); flex: 1; }
    /* Sticky footer */
    .reg-footer {
      position: sticky; bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; flex-shrink: 0;
      backdrop-filter: blur(10px);
    }
    .reg-footer .btn { flex: 1; height: 52px; border-radius: 12px; }
    /* Terms checkbox */
    .terms-row {
      display: flex; align-items: flex-start; gap: 10px;
      margin: 12px 0;
    }
    .terms-row input[type=checkbox] {
      width: 20px; height: 20px; margin-top: 2px;
      accent-color: var(--blue); flex-shrink: 0; cursor: pointer;
    }
    .terms-row label { font-size: .8rem; color: var(--text-mid); line-height: 1.5; }
    .terms-row a { color: var(--blue); font-weight: 600; }
    /* Step heading */
    .step-h { font-size: 1.1rem; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
    .step-sub { font-size: .82rem; color: var(--text-mid); line-height: 1.5; margin-bottom: 20px; }
    /* Niche select tag colors */
    .niche-sel { appearance: none; }
  </style>
</head>
<body>
  <div class="screen">
    <!-- Topbar -->
    <header class="pub-topbar">
      <button class="topbar-back-btn" onclick="_mobRegBack()" aria-label="Späť">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="pub-logo-center" id="reg-topbar-title">Registrácia</span>
      <div class="topbar-spacer"></div>
    </header>

    <!-- Progress bar -->
    <div class="reg-progress"><div class="reg-progress-fill" id="reg-prog"></div></div>

    <!-- Scrollable content -->
    <div class="content" id="reg-content">
      <!-- rendered by renderMobRegister() -->
    </div>

    <!-- Sticky footer -->
    <div class="reg-footer" id="reg-footer">
      <!-- rendered by renderMobRegister() -->
    </div>
  </div>

  <script src="shared/core.js"></script>
  <script src="shared/state.js"></script>
  <script src="shared/lang.js"></script>
  <script src="shared/auth.js"></script>
  <script src="shared/toast.js"></script>
  <script>
    // ── Local state (nie v state.js) ─────────────────────────────────────────
    let _mobRegStep = 1;
    let _mobRegRole = null;  // 'influencer' | 'business'

    // Pre-fill role from URL param
    const _urlRole = new URLSearchParams(location.search).get('role');
    if (_urlRole === 'influencer' || _urlRole === 'business') {
      _mobRegRole = _urlRole;
      _mobRegStep = 2;
    }

    // ── Total steps per role ─────────────────────────────────────────────────
    function _totalSteps() {
      if (_mobRegRole === 'influencer') return 4;
      if (_mobRegRole === 'business')   return 2;
      return 1;
    }

    function _isLastStep() {
      return _mobRegStep >= _totalSteps();
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function renderMobRegister() {
      const total = _totalSteps();
      const pct   = _mobRegRole ? (_mobRegStep / total) * 100 : 10;
      document.getElementById('reg-prog').style.width = pct + '%';

      // Topbar title
      const titles = {
        1: 'Registrácia',
        2: _mobRegRole === 'influencer' ? 'Tvoj profil'    : 'Firma',
        3: 'Sociálne siete',
        4: 'Potvrdenie',
      };
      document.getElementById('reg-topbar-title').textContent = titles[_mobRegStep] || 'Registrácia';

      const content = document.getElementById('reg-content');
      const footer  = document.getElementById('reg-footer');

      // ── Step 1: Role výber ─────────────────────────────────────────────
      if (_mobRegStep === 1) {
        content.innerHTML = `
          <div class="pad" style="padding-top:32px;max-width:400px;margin:0 auto">
            <div class="step-h">Vyber svoju rolu</div>
            <p class="step-sub">Ako chceš ibbi používať?</p>
            <div style="display:flex;flex-direction:column;gap:12px">
              <div class="role-card${_mobRegRole==='business'?' selected':''}"
                onclick="_selectRole('business')">
                <div class="role-card-ic biz">🏢</div>
                <div class="role-card-body">
                  <div class="role-card-title">Business</div>
                  <div class="role-card-sub">Hľadám influencerov pre kampane svojej firmy</div>
                </div>
                <span class="role-card-arrow">›</span>
              </div>
              <div class="role-card${_mobRegRole==='influencer'?' selected':''}"
                onclick="_selectRole('influencer')">
                <div class="role-card-ic infl">⭐</div>
                <div class="role-card-body">
                  <div class="role-card-title">Influencer</div>
                  <div class="role-card-sub">Hľadám kampane a chcem zarábať tvorbou obsahu</div>
                </div>
                <span class="role-card-arrow">›</span>
              </div>
            </div>
          </div>`;
        footer.innerHTML = `
          <button class="btn btn-blue" onclick="mobRegNext()"
            style="width:100%;height:52px;border-radius:12px">
            ${t('reg-next-btn')||'Ďalej →'}
          </button>`;
        return;
      }

      // ── Influencer steps ──────────────────────────────────────────────
      if (_mobRegRole === 'influencer') {

        if (_mobRegStep === 2) {
          // Influencer: personal info
          content.innerHTML = `
            <div class="pad" style="max-width:400px;margin:0 auto">
              <div class="step-h">Osobné informácie</div>
              <p class="step-sub">Krok 1 z 3 — vyplň základné údaje</p>
              <div id="infl-signup-err" class="mob-err"></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
                <div class="field" style="margin-bottom:0">
                  <label>Meno</label>
                  <input class="input" id="infl-first" placeholder="Jana" autocomplete="given-name">
                </div>
                <div class="field" style="margin-bottom:0">
                  <label>Priezvisko</label>
                  <input class="input" id="infl-last" placeholder="Nováková" autocomplete="family-name">
                </div>
              </div>
              <div class="field">
                <label>Username</label>
                <input class="input" id="infl-username" placeholder="@jana_novakova" autocomplete="username"
                  oninput="this.value=this.value.replace(/^@/,'')">
              </div>
              <div class="field">
                <label>Niche / kategória</label>
                <select class="select niche-sel" id="infl-niche">
                  <option value="">Vyber kategóriu…</option>
                  <option>Fashion</option><option>Beauty</option>
                  <option>Fitness</option><option>Food</option>
                  <option>Travel</option><option>Tech</option>
                  <option>Gaming</option><option>Lifestyle</option>
                  <option>Business</option><option>Other</option>
                </select>
              </div>
              <div class="field">
                <label>Bio (voliteľné)</label>
                <textarea class="input" id="infl-bio" rows="3"
                  placeholder="Pár viet o sebe a tvojom obsahu…"
                  style="resize:none;line-height:1.5"></textarea>
              </div>
              <div class="field">
                <label>Email</label>
                <input class="input" id="infl-email" type="email"
                  placeholder="jana@example.com" autocomplete="email" inputmode="email">
              </div>
              <div class="field" style="margin-bottom:0">
                <label>Heslo (min. 8 znakov)</label>
                <input class="input" id="infl-pass" type="password"
                  placeholder="••••••••" autocomplete="new-password">
              </div>
            </div>`;
          if (S.pendingInfl) {
            const p = S.pendingInfl;
            const first = p.fullName?.split(' ')[0] || '';
            const last  = p.fullName?.split(' ').slice(1).join(' ') || '';
            const inp = id => document.getElementById(id);
            if (inp('infl-first'))    inp('infl-first').value    = first;
            if (inp('infl-last'))     inp('infl-last').value     = last;
            if (inp('infl-username')) inp('infl-username').value = p.username || '';
            if (inp('infl-niche'))    inp('infl-niche').value    = p.niche || '';
            if (inp('infl-email'))    inp('infl-email').value    = p.email || '';
          }
        }

        else if (_mobRegStep === 3) {
          // Influencer: social verification
          verifiedCount = 0;
          if (!S.connectedSocials) S.connectedSocials = [];
          S.connectedSocials = [];
          const platforms = [
            { id:'instagram', name:'Instagram', ic:'📸', color:'#E1306C' },
            { id:'tiktok',    name:'TikTok',    ic:'🎵', color:'#000' },
            { id:'youtube',   name:'YouTube',   ic:'▶️', color:'#FF0000' },
            { id:'facebook',  name:'Facebook',  ic:'👤', color:'#1877F2' },
          ];
          const cards = platforms.map(p => {
            const connected = (S.connectedSocials||[]).includes(p.id);
            return `<div class="plat-card${connected?' connected':''}" id="verify-${p.id}">
              <div class="plat-ic" style="background:${p.ic==='📸'?'#fce4ec':p.ic==='🎵'?'#f3e5f5':p.ic==='▶️'?'#ffebee':'#e3f2fd'}">${p.ic}</div>
              <span class="plat-name">${p.name}</span>
              <button class="plat-btn${connected?' done':''}"
                onclick="connectSocial('${p.id}')"
                ${connected?'disabled':''}>
                ${connected?'Pripojené ✓':'Pripojiť'}
              </button>
            </div>`;
          }).join('');
          const cnt = (S.connectedSocials||[]).length;
          content.innerHTML = `
            <div class="pad" style="max-width:400px;margin:0 auto">
              <div class="step-h">Sociálne siete</div>
              <p class="step-sub">Krok 2 z 3 — pripoj aspoň 1 platformu na overenie</p>
              <div id="verify-msg" style="font-size:.82rem;font-weight:600;color:#10b981;margin-bottom:14px;min-height:18px">
                ${cnt>0?cnt+' platforma'+((cnt>1)?'y':'')+ ' pripojená ✓':''}
              </div>
              ${cards}
            </div>`;
        }

        else if (_mobRegStep === 4) {
          // Influencer: review
          const p = S.pendingInfl || {};
          content.innerHTML = `
            <div class="pad" style="max-width:400px;margin:0 auto">
              <div class="step-h">Skontroluj údaje</div>
              <p class="step-sub">Krok 3 z 3 — potvrď registráciu</p>
              <div id="infl-signup-err" class="mob-err"></div>
              <div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:6px 16px;margin-bottom:16px">
                <div class="sum-row">
                  <span class="sum-k">Meno</span>
                  <span class="sum-v">${p.fullName||'—'}</span>
                </div>
                <div class="sum-row">
                  <span class="sum-k">Username</span>
                  <span class="sum-v">@${p.username||'—'}</span>
                </div>
                <div class="sum-row">
                  <span class="sum-k">Email</span>
                  <span class="sum-v">${p.email||'—'}</span>
                </div>
                <div class="sum-row">
                  <span class="sum-k">Niche</span>
                  <span class="sum-v">${p.niche||'—'}</span>
                </div>
                <div class="sum-row" style="border-bottom:none">
                  <span class="sum-k">Platformy</span>
                  <span class="sum-v">${(S.connectedSocials||[]).join(', ')||'—'}</span>
                </div>
              </div>
              <div style="font-size:.78rem;color:var(--text-mid);line-height:1.5;background:var(--blue-light);border-radius:10px;padding:12px">
                Po dokončení dostaneš potvrdzovací email. Skontroluj schránku.
              </div>
            </div>`;
        }

        // Footer for influencer steps
        footer.innerHTML = `
          ${_mobRegStep > 1 ? `<button class="btn btn-outline" onclick="mobRegBack()"
            style="height:52px;border-radius:12px;flex:0 0 auto;padding:0 20px">← Späť</button>` : ''}
          <button id="infl-signup-btn" class="btn btn-blue" onclick="mobRegNext()"
            style="height:52px;border-radius:12px">
            ${_mobRegStep === 4 ? 'Dokončiť ✓' : t('reg-next-btn')||'Ďalej →'}
          </button>`;
        return;
      }

      // ── Business steps ────────────────────────────────────────────────
      if (_mobRegRole === 'business') {

        if (_mobRegStep === 2) {
          content.innerHTML = `
            <div class="pad" style="max-width:400px;margin:0 auto">
              <div class="step-h">Informácie o firme</div>
              <p class="step-sub">Vyplň údaje o tvojej firme</p>
              <div id="biz-signup-err" class="mob-err"></div>
              <div class="field">
                <label>Názov firmy *</label>
                <input class="input" id="biz-company" placeholder="napr. TechFlow s.r.o." autocomplete="organization">
              </div>
              <div class="field">
                <label>Odvetvie *</label>
                <select class="select" id="biz-industry">
                  <option value="">Vyber odvetvie…</option>
                  <option>E-commerce</option><option>Tech / SaaS</option>
                  <option>Fashion & Beauty</option><option>Food & Beverage</option>
                  <option>Health & Fitness</option><option>Travel</option>
                  <option>Finance</option><option>Education</option>
                  <option>Entertainment</option><option>Other</option>
                </select>
              </div>
              <div class="field">
                <label>Web (voliteľné)</label>
                <input class="input" id="biz-website" type="url"
                  placeholder="https://vasfirma.sk" autocomplete="url" inputmode="url">
              </div>
              <div class="field">
                <label>Firemný email *</label>
                <input class="input" id="biz-email" type="email"
                  placeholder="info@firma.sk" autocomplete="email" inputmode="email">
              </div>
              <div class="field" style="margin-bottom:8px">
                <label>Heslo (min. 8 znakov) *</label>
                <input class="input" id="biz-pass" type="password"
                  placeholder="••••••••" autocomplete="new-password">
              </div>
              <div class="terms-row">
                <input type="checkbox" id="biz-terms">
                <label for="biz-terms">
                  Súhlasím s <a href="#">Podmienkami</a> a
                  <a href="#">Zásadami ochrany súkromia</a>
                </label>
              </div>
            </div>`;
        }

        footer.innerHTML = `
          <button class="btn btn-outline" onclick="mobRegBack()"
            style="height:52px;border-radius:12px;flex:0 0 auto;padding:0 20px">← Späť</button>
          <button id="biz-signup-btn" class="btn btn-blue" onclick="mobRegNext()"
            style="height:52px;border-radius:12px">
            Dokončiť ✓
          </button>`;
      }
    }

    // ── Navigation ────────────────────────────────────────────────────────────
    function _selectRole(role) {
      _mobRegRole = role;
      renderMobRegister();
    }

    function mobRegBack() {
      if (_mobRegStep > 1) {
        _mobRegStep--;
        renderMobRegister();
      } else {
        history.back();
      }
    }

    function _mobRegBack() {
      if (_mobRegStep > 1) {
        _mobRegStep--;
        renderMobRegister();
      } else {
        history.back();
      }
    }

    // ── Next step logic ───────────────────────────────────────────────────────
    async function mobRegNext() {
      if (_mobRegStep === 1) {
        if (!_mobRegRole) { toast('Vyber rolu', 'error'); return; }
        _mobRegStep = 2;
        renderMobRegister();
        return;
      }

      // ── Influencer flow ───────────────────────────────────────────────
      if (_mobRegRole === 'influencer') {
        if (_mobRegStep === 2) {
          await _doMobInflCollect();
          return;
        }
        if (_mobRegStep === 3) {
          if (!S.connectedSocials?.length) {
            toast('Pripoj aspoň 1 platformu', 'error'); return;
          }
          _mobRegStep = 4;
          renderMobRegister();
          return;
        }
        if (_mobRegStep === 4) {
          const btn = document.getElementById('infl-signup-btn');
          if (btn) { btn.textContent = 'Dokončujem…'; btn.disabled = true; }
          await finishInflSignup();
          return;
        }
      }

      // ── Business flow ─────────────────────────────────────────────────
      if (_mobRegRole === 'business') {
        if (_mobRegStep === 2) {
          await doBizSignup();
          return;
        }
      }
    }

    // ── Collect influencer data (step 2) without navigating away ─────────────
    async function _doMobInflCollect() {
      const first = document.getElementById('infl-first')?.value.trim();
      const last  = document.getElementById('infl-last')?.value.trim();
      const user  = document.getElementById('infl-username')?.value.trim().replace(/^@/, '');
      const email = document.getElementById('infl-email')?.value.trim();
      const pass  = document.getElementById('infl-pass')?.value;
      const niche = document.getElementById('infl-niche')?.value;
      const err   = document.getElementById('infl-signup-err');
      const btn   = document.getElementById('infl-signup-btn');

      if (err) err.style.display = 'none';

      if (!first || !last || !user || !email || !pass || !niche) {
        if (err) { err.textContent = t('err-fill-required')||'Vyplň všetky povinné polia.'; err.style.display = 'block'; }
        return;
      }
      if (pass.length < 8) {
        if (err) { err.textContent = t('err-pwd-length')||'Heslo musí mať aspoň 8 znakov.'; err.style.display = 'block'; }
        return;
      }
      if (btn) { btn.textContent = t('btn-saving')||'Vytváranie účtu…'; btn.disabled = true; }

      // If already logged in (adding role)
      if (APP.user) {
        const { data: existing } = await _sb.from('influencer_profiles')
          .select('id').eq('user_id', APP.user.id).maybeSingle();
        if (existing) {
          if (err) { err.textContent = t('err-infl-exists')||'Influencer účet pre tento email už existuje.'; err.style.display = 'block'; }
          if (btn) { btn.textContent = t('reg-next-btn')||'Ďalej →'; btn.disabled = false; }
          return;
        }
        S.pendingInfl = { userId: APP.user.id, fullName: `${first} ${last}`, username: user, niche, email: APP.user.email };
        S.connectedSocials = [];
        if (btn) { btn.textContent = t('reg-next-btn')||'Ďalej →'; btn.disabled = false; }
        _mobRegStep = 3;
        renderMobRegister();
        return;
      }

      // New signup
      S.pendingInfl = { fullName: `${first} ${last}`, username: user, niche, email };
      const { data, error } = await _sb.auth.signUp({
        email, password: pass,
        options: { data: { role: 'influencer', full_name: `${first} ${last}`, username: user, niche } }
      });

      if (error || !data.user || data.user.identities?.length === 0) {
        S.pendingInfl = null;
        if (btn) { btn.textContent = t('reg-next-btn')||'Ďalej →'; btn.disabled = false; }
        if (err) {
          err.textContent = error?.message || t('err-infl-exists')||'Účet s týmto emailom už existuje.';
          err.style.display = 'block';
        }
        return;
      }

      S.pendingInfl.userId = data.user.id;
      S.connectedSocials = [];
      if (btn) { btn.textContent = t('reg-next-btn')||'Ďalej →'; btn.disabled = false; }
      _mobRegStep = 3;
      renderMobRegister();
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    renderMobRegister();
  </script>
</body>
</html>
