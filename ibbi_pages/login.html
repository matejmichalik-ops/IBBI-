<!DOCTYPE html>
<html lang="en">
<head>
<script>
  if(/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||window.innerWidth<768)
    window.location.replace('login-mobile.html'+location.search+location.hash);
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBBI — Sign In</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<script src="shared/icons.js"></script>

<div id="page-login">
  <div style="position:absolute;top:16px;right:20px">
    <div class="lang-switcher app-lang">
      <button class="lang-btn active" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" data-lang="sk" onclick="setLang('sk')">SK</button>
    </div>
  </div>
  <div style="min-height:90vh;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);padding:40px 20px">
    <div style="max-width:440px;width:100%">
      <div class="card" style="padding:48px 40px">
        <div style="text-align:center;margin-bottom:32px">
          <div class="nav-logo" style="justify-content:center;margin-bottom:8px;display:flex">
            <svg viewBox="0 0 80 32" width="72" height="28" xmlns="http://www.w3.org/2000/svg">
              <text x="0" y="26" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#2079FF">IBBI</text>
            </svg>
          </div>
          <h2 style="color:var(--navy);margin-bottom:4px" data-i18n="login-title">Welcome back</h2>
          <p style="color:var(--text-mid);font-size:.9rem" data-i18n="login-sub">Sign in to your account</p>
        </div>
        <a href="index.html"
          data-i18n="reg-back-btn"
          style="display:inline-flex;align-items:center;gap:6px;
            font-size:.85rem;font-weight:600;color:var(--text-mid);
            text-decoration:none;margin-bottom:20px;
            padding:6px 0"
          onmouseover="this.style.color='var(--navy)'"
          onmouseout="this.style.color='var(--text-mid)'">← Späť</a>
        <div style="display:flex;background:var(--blue-light);border-radius:10px;padding:4px;margin-bottom:28px;gap:4px">
          <button id="login-tab-biz" onclick="switchLoginTab('biz')" style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;background:white;color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.08)">Business</button>
          <button id="login-tab-infl" onclick="switchLoginTab('infl')" style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;background:transparent;color:var(--text-mid)">Influencer</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <div>
            <label style="font-size:.85rem;font-weight:600;color:var(--navy);display:block;margin-bottom:6px" data-i18n="fld-email">Email</label>
            <input id="login-email" type="email" placeholder="you@example.com" style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;outline:none;box-sizing:border-box;transition:.2s" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
          </div>
          <div>
            <label style="font-size:.85rem;font-weight:600;color:var(--navy);display:block;margin-bottom:6px" data-i18n="fld-password">Password</label>
            <input id="login-pass" type="password" placeholder="••••••••" style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;outline:none;box-sizing:border-box;transition:.2s" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
          </div>
          <button class="btn btn-primary" style="width:100%;padding:14px;margin-top:4px;font-size:1rem" data-i18n="login-btn" onclick="doLogin()">Sign In</button>
        </div>
        <p style="text-align:center;color:var(--text-mid);font-size:.9rem;margin-top:20px" data-i18n="login-signup-link">Don't have an account? <a onclick="go('signup-role')" style="color:var(--blue);cursor:pointer;font-weight:600">Sign up free</a></p>
        <div style="margin-top:16px;padding:16px;background:var(--blue-light);border-radius:10px;text-align:center">
          <p style="font-size:.8rem;color:var(--text-mid);margin-bottom:10px;font-weight:600">DEMO</p>
          <div style="display:flex;gap:8px;justify-content:center">
            <button onclick="demoLogin('business')" style="padding:7px 16px;border:1.5px solid var(--blue);background:white;color:var(--blue);border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer">Business Demo</button>
            <button onclick="demoLogin('influencer')" style="padding:7px 16px;border:1.5px solid var(--blue);background:white;color:var(--blue);border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer">Influencer Demo</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/toast.js"></script>
<script src="shared/state.js"></script>
<script src="shared/core.js"></script>
<script src="shared/lang.js"></script>
<script src="shared/router.js"></script>
<script src="shared/auth.js"></script>
</body>
</html>
